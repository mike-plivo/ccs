[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs"
version = "1.5.3"
description = "Terminal UI and CLI for managing coding assistant sessions (Claude Code, Codex, opencode)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.40",
    "rich>=13.0",
]

[project.optional-dependencies]
remote = [
    "websockets>=12.0",
    "PyJWT>=2.0",
    "bcrypt>=4.0",
]

[project.scripts]
ccs = "ccs:main"

[tool.setuptools]
py-modules = ["ccs", "ccs_protocol", "ccs_remote", "ccs_serve"]
